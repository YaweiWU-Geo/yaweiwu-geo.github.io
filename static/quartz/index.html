const names=['基面 ⟨a⟩','菱面 ⟨a⟩','菱面 ⟨a⟩','柱面 ⟨a⟩','柱面 [c]'];
G.panels.forEach((p,i)=>{let b=document.createElement('button');b.textContent=p.letter;b.onclick=()=>{index=i;update()};$('tabs').append(b)});
function update(){const p=G.panels[index];$('caption').textContent=p.letter+'  '+names[index]+' / '+p.name;$('indices').textContent='('+p.plane.join(' ')+')  ['+p.direction.join(' ')+']';[...$('tabs').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===index));draw()}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,3);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='white';ctx.fillRect(0,0,w,h);let scale=Math.min(w*.29,h*.34)*zoom;
let camera=[Math.sin(az)*Math.cos(el),-Math.cos(az)*Math.cos(el),Math.sin(el)],right=[Math.cos(az),Math.sin(az),0],up=cross(camera,right),P=v=>[w/2+scale*dot(v,right),h/2-scale*dot(v,up)],depth=v=>dot(v,camera);
function line(a,b,color,width=1,dash=[]){a=P(a);b=P(b);ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function poly(pts,color,edge=null){ctx.beginPath();pts.forEach((v,i)=>{let p=P(v);i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.closePath();ctx.fillStyle=color;ctx.fill();if(edge){ctx.strokeStyle=edge;ctx.lineWidth=1.3;ctx.stroke()}}
function arrow(a,b,color,width=1.4){let pa=P(a),pb=P(b),dx=pb[0]-pa[0],dy=pb[1]-pa[1],l=Math.hypot(dx,dy);if(l<2)return;let ux=dx/l,uy=dy/l,k=Math.min(9,l*.35);line(a,b,color,width);ctx.beginPath();ctx.moveTo(...pb);ctx.lineTo(pb[0]-k*ux-k*.4*uy,pb[1]-k*uy+k*.4*ux);ctx.lineTo(pb[0]-k*ux+k*.4*uy,pb[1]-k*uy-k*.4*ux);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function label(v,t){let p=P(v),dx=p[0]<w/2-5?-18:6;ctx.fillStyle='#000000';ctx.font='14px Arial';ctx.fillText(t,p[0]+dx,p[1]-5)}
const p=G.panels[index],faces=G.faces.map(f=>f.map(i=>G.vertices[i-1])),front=faces.map(v=>{let n=cross(sub(v[1],v[0]),sub(v[2],v[0])),c=v.reduce((s,x)=>s.map((a,j)=>a+x[j]/v.length),[0,0,0]);return dot(n,c)*dot(n,camera)>0});
faces.forEach((v,i)=>{if(!front[i])poly(v,'rgba(160,188,210,.12)')});
G.edges.forEach(([a,b])=>line(G.vertices[a-1],G.vertices[b-1],'#a4b4c0',.8,[3,4]));
if($('plane').checked)poly(p.section,'rgba(239,148,41,.60)','#a75b16');if($('slip').checked)poly(p.arrow,'#ba1f1f');
faces.forEach((v,i)=>{if(front[i])poly(v,'rgba(180,208,225,.10)')});
G.edges.forEach(([a,b])=>{if(G.faces.some((f,j)=>front[j]&&f.includes(a)&&f.includes(b)))line(G.vertices[a-1],G.vertices[b-1],'#455f73',1)});
if($('axes').checked)G.latticeAxes.forEach((v,i)=>{let l=i===3?1.16:.96;line(mul(v,-l),mul(v,l),'#000',.8,[3,4]);arrow(mul(v,l*.8),mul(v,l),'#000',.9);label(mul(v,l*1.10),['a1','a2','a3','c'][i])});
if($('normal').checked){arrow([0,0,0],mul(p.normal,.59),'#21619e');label(mul(p.normal,.64),'n')}if($('slip').checked)label(mul(p.burgersDirection,.82*p.rayHalfLength),'b');}
let pointers=new Map(),prev=null;function state(){let p=[...pointers.values()];return p.length>1?{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}:{...p[0],d:0}}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});prev=state()};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let s=state();if(prev){az+=(s.x-prev.x)*.009;el=Math.max(-1.5,Math.min(1.5,el+(s.y-prev.y)*.009));if(s.d&&prev.d)zoom=Math.max(.45,Math.min(2.1,zoom*s.d/prev.d));draw()}prev=s};function release(e){pointers.delete(e.pointerId);prev=pointers.size?state():null}canvas.onpointerup=release;canvas.onpointercancel=release;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.45,Math.min(2.1,zoom*Math.exp(-e.deltaY*.001)));draw()};
$('reset').onclick=()=>{az=G.azimuth*Math.PI/180;el=G.elevation*Math.PI/180;zoom=1;spinning=false;$('spin').setAttribute('aria-pressed',false);draw()};$('spin').onclick=()=>{spinning=!spinning;$('spin').setAttribute('aria-pressed',spinning)};['axes','plane','slip','normal'].forEach(id=>$(id).onchange=draw);$('save').onclick=()=>{let a=document.createElement('a');a.download='Quartz_'+G.panels[index].letter+'.png';a.href=canvas.toDataURL('image/png');a.click()};new ResizeObserver(draw).observe(canvas);function tick(t){if(spinning&&!pointers.size){az+=Math.min(t-last,50)*.0003;draw()}last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);update();
</script></html>
